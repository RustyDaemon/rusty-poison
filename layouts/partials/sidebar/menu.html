<nav class="panel-section" aria-label="Primary">
    <div class="panel-section-label">// nav</div>
    <a href="{{ .Site.BaseURL }}" class="panel-link {{ if .IsHome }}active{{ end }}">home</a>
    {{ range .Site.Params.menu }}
        {{ $url := .URL }}
        <a href="{{ $url }}" class="panel-link {{ if and (ne $.RelPermalink "/") (hasPrefix $.RelPermalink $url) }}active{{ end }}">{{ .Name }}</a>
    {{ end }}
</nav>
