<div class="panel-foot">
    <div>
        <a href="https://gohugo.io" target="_blank" rel="noopener">hugo</a>
        +
        <a href="https://github.com/RustyDaemon/rusty-poison" target="_blank" rel="noopener">rusty-poison</a>
    </div>
    {{ $year := now.Year }}
    {{ $years := string $year }}
    {{ with .Site.Params.copyright_start_year }}
        {{ if lt (int .) $year }}{{ $years = printf "%d–%d" (int .) $year }}{{ end }}
    {{ end }}
    <div>© {{ $years }} {{ or .Site.Language.Params.Author.name .Site.Title }}</div>
</div>
