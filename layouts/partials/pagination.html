{{ $pag := .Paginator }}
{{ if and $pag (gt $pag.TotalPages 1) }}
<nav class="pagination" aria-label="Pagination">
    {{ if $pag.HasPrev }}
        <a href="{{ $pag.Prev.URL }}" rel="prev">‹ prev</a>
    {{ end }}
    {{ range $pag.Pagers }}
        {{ if eq . $pag }}
            <span class="current">{{ .PageNumber }}</span>
        {{ else }}
            <a href="{{ .URL }}">{{ .PageNumber }}</a>
        {{ end }}
    {{ end }}
    {{ if $pag.HasNext }}
        <a href="{{ $pag.Next.URL }}" rel="next">next ›</a>
    {{ end }}
</nav>
{{ end }}
